id: password-spray
title: Password spraying from a single source
type: password_spray
severity: medium
attack:
  - id: T1110.003
    name: "Brute Force: Password Spraying"
description: >
  One source address fails to log in as many different accounts in a short window.
  Spraying tries a few common passwords against many users to stay under per-account
  lockout thresholds.
params:
  min_users: 5
  window_minutes: 30
references:
  - https://attack.mitre.org/techniques/T1110/003/
