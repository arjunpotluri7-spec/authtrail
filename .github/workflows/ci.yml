name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev requirements
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt && pip install -e .
      - name: Tests
        run: pytest -q
      - name: Smoke test against samples (exit 1 = findings, expected)
        run: |
          authtrail analyze samples/linux_auth.log samples/macos_unified.ndjson \
            samples/windows_security.json --config config.example.yaml --year 2026 \
            || test $? -eq 1
          authtrail analyze samples/linux_auth.log samples/macos_unified.ndjson \
            samples/windows_security.json --config config.example.yaml --year 2026 \
            --format json --fail-on none > /dev/null
          authtrail validate-config config.example.yaml
          authtrail rules list
